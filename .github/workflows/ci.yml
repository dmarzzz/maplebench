name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: node scripts/check-tracked-files.mjs
      - run: npm test
      - run: python3 -m unittest discover -s test -p 'test_*.py'
      - name: Verify production CLI admission in private root-owned fixtures
        run: |
          timeout 180s sudo python3 - <<'PY'
          import os, pathlib, resource, subprocess, sys, tempfile
          source = pathlib.Path.cwd()
          with tempfile.TemporaryDirectory(prefix="maplebench-cli-tests-") as temporary:
              root = pathlib.Path(temporary)
              for directory in ("scripts", "test"):
                  (root / directory).mkdir(mode=0o700)
                  for entry in (source / directory).glob("*.py"):
                      if not entry.is_file() or entry.is_symlink():
                          raise RuntimeError("regular source file required")
                      target = root / directory / entry.name
                      target.write_bytes(entry.read_bytes())
                      target.chmod(0o600)
              resource.setrlimit(resource.RLIMIT_AS, (768 * 1024**2, 768 * 1024**2))
              resource.setrlimit(resource.RLIMIT_CPU, (120, 120))
              os.sched_setaffinity(0, set(sorted(os.sched_getaffinity(0))[:2]))
              result = subprocess.run([sys.executable, "-B", "-m", "unittest", "discover",
                  "-s", "test", "-p", "test_full_client_operation_cli.py", "-v"], cwd=root,
                  env={"PATH": "/usr/bin:/bin", "LC_ALL": "C", "PYTHONDONTWRITEBYTECODE": "1"}, timeout=120)
              sys.exit(result.returncode)
          PY
      - name: Verify native save receipts without game assets or a server
        env:
          MAVEN_OPTS: -Xmx768m -XX:ActiveProcessorCount=2
        run: timeout 300s mvn -B -q -f test/persistence/pom.xml test
      - name: Verify isolated program execution
        run: |
          docker pull node:22.19.0-bookworm-slim
          MAPLEBENCH_TEST_DOCKER=1 python3 -m unittest discover -s test -p 'test_maple_agent.py'
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan full history with verified Gitleaks binary
        shell: bash
        run: |
          set -euo pipefail
          scanner_dir=$(mktemp -d)
          cd "$scanner_dir"
          curl -fsSL --retry 3 -O https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSL --retry 3 -O https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          awk '$2 == "gitleaks_8.30.1_linux_x64.tar.gz"' gitleaks_8.30.1_checksums.txt | sha256sum --check --strict
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          ./gitleaks git "$GITHUB_WORKSPACE" --redact --no-banner --log-opts=--all
