name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/check-tracked-files.mjs
      - run: npm test
      - run: python3 -m unittest discover -s test -p 'test_*.py'
      - name: Verify isolated program execution
        run: |
          docker pull node:22.19.0-bookworm-slim
          MAPLEBENCH_TEST_DOCKER=1 python3 -m unittest discover -s test -p 'test_maple_agent.py'
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan full history with verified Gitleaks binary
        shell: bash
        run: |
          set -euo pipefail
          scanner_dir=$(mktemp -d)
          cd "$scanner_dir"
          curl -fsSL --retry 3 -O https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSL --retry 3 -O https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          awk '$2 == "gitleaks_8.30.1_linux_x64.tar.gz"' gitleaks_8.30.1_checksums.txt | sha256sum --check --strict
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          ./gitleaks git "$GITHUB_WORKSPACE" --redact --no-banner --log-opts=--all
